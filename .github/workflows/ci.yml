name: CI

on:
  pull_request:
    branches: [develop, main, team-dev]
  push:
    branches: [develop, main, team-dev]

jobs:
  lint-and-build-node:
    name: Lint & Build (web + api)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Lint web
        run: pnpm --filter web lint

      - name: Lint api
        run: pnpm --filter api lint

      - name: Build web
        run: pnpm --filter web build

      - name: Build api
        run: pnpm --filter api build

  test-api:
    name: Test (api — unit + integration)
    runs-on: ubuntu-latest
    # Disposable PostgreSQL with pgvector: integration tests run against the same
    # database engine as production, never against the shared Neon database.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infrasentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/infrasentinel_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Unit tests
        run: pnpm --filter api exec jest --ci --coverage

      - name: Integration tests (real database)
        run: pnpm --filter api exec jest --config ./test/jest-integration.json --runInBand --ci --coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage/

  test-agent:
    name: Test (monitoring agent)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: apps/agent/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint tests with ruff
        run: ruff check tests

      - name: Run tests
        run: pytest --cov=. --cov-report=term

  lint-ai-service:
    name: Lint & Test (ai-service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    # Disposable PostgreSQL with pgvector for the RAG isolation tests.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAG_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rag_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: apps/ai-service/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov

      - name: Lint with ruff
        run: ruff check .

      - name: Verify app imports cleanly
        run: python -c "import main"

      - name: Run tests (ML pipeline, RAG, API)
        run: pytest --cov=. --cov-report=term

  dependency-audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    # Informational: lists known vulnerabilities in dependencies without failing
    # the build (see docs/sqa/SECURITY_TESTING.md).
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Audit Node production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r apps/ai-service/requirements.txt
          pip-audit -r apps/agent/requirements.txt
